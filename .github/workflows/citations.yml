name: citations

# Bibliography check: every DOI in docs/related-work.md and README.md resolves at doi.org and its
# title and authors match Crossref / DataCite. Runs when those files change and monthly.
on:
  push:
    branches: [main]
    paths: [README.md, docs/related-work.md, scripts/check_citations.py, .github/workflows/citations.yml]
  pull_request:
    paths: [README.md, docs/related-work.md, scripts/check_citations.py]
  schedule:
    - cron: "41 5 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/check_citations.py
